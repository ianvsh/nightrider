# tmux for the TERM page (nightrider-term.service). The page is only 66x26,
# so no status bar.
set -g status off
set -g escape-time 0
set -g history-limit 5000
# No prefix key at all: ctrl-b is a Claude Code key (run in background), and in
# tmux ctrl-b + almost anything is a tmux command that eats the typing - ctrl-b
# ctrl-z suspended the client (keys stopped reaching Claude until the display
# restarted, 2026-10-16), ctrl-b : opens a prompt the hidden status bar never
# shows, ctrl-b [ / s / w are modes that swallow keys. Nothing here needs it:
# finger drags scroll (mouse wheel) and the display reattaches by itself.
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
# The TERM page turns finger drags into mouse-wheel steps: tmux passes them to
# programs that take the mouse (Claude Code scrolls itself) or scrolls back itself.
set -g mouse on
