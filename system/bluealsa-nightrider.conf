[Service]
# --sbc-quality=medium (2026-11-15): ~230 kbps instead of 328; the TR7412 link floods with errors
# while streaming and the lower rate leaves room to recover (music was choppy).
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-source --a2dp-force-audio-cd --keep-alive=5 --sbc-quality=medium
