# Keep logs across reboots so a drive can be checked afterwards, but cap them
# so the SD card isn't worn: 20 MB total, flushed every 30 s (a power cut
# loses at most the last half-minute).
[Journal]
Storage=persistent
SystemMaxUse=20M
SystemMaxFileSize=4M
SyncIntervalSec=30s
MaxRetentionSec=3month
