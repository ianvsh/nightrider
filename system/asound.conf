# Spotify plays to "default" = its own Loopback channel (hw:Loopback,0,1); the AI page's
# voice to "voicebus" (hw:Loopback,0,2). Neither ever goes away, so Spotify is never
# restarted for the voice or a route change (2026-11-15: each start fires a burst of Web
# API calls - 42 restarts in a day got Ian's Spotify app blocked for 21 hours).
# NO dmix: spotify_player's audio (rodio/cpal) spins at 70% CPU writing nothing on a dmix
# (2026-11-16: silent all day). The touchscreen's audio bridge (bt.py Bridge) adds the
# two channels and plays them to the output the AUDIO setting says: "tap" (headphone jack + visualiser copy) or "tap_bt" (the
# Bluetooth stereo). Switching outputs moves the bridge, never restarts Spotify.
# Source: ~/nightrider/system/asound.conf
pcm.!default {
    type plug
    slave {
        pcm "hw:Loopback,0,1"
        format S16_LE
        rate 44100
        channels 2
    }
}
# The AI page's voice (speech.py plays to "voicebus"): its own Loopback channel; the
# bridge reads both back (hw:Loopback,1,1 and 1,2) and adds them together.
pcm.voicebus {
    type plug
    slave {
        pcm "hw:Loopback,0,2"
        format S16_LE
        rate 44100
        channels 2
    }
}
# What the bridge plays to over AUX: the headphone jack (the amp) plus, as a copy,
# the Loopback card for the Spotify visualiser (arecord -D hw:Loopback,1,0).
ctl.!default {
    type hw
    card Headphones
}
pcm.tap {
    type route
    slave.pcm "tap_multi"
    slave.channels 4
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}
pcm.tap_multi {
    type multi
    slaves.a.pcm "speakers"
    slaves.a.channels 2
    slaves.b.pcm "tap_copy"
    slaves.b.channels 2
    bindings.0 { slave a; channel 0; }
    bindings.1 { slave a; channel 1; }
    bindings.2 { slave b; channel 0; }
    bindings.3 { slave b; channel 1; }
}
# Plain hw, no dmix: dmix on the bcm2835 jack hangs. Only the bridge plays to it.
pcm.speakers {
    type hw
    card Headphones
    device 0
}
pcm.tap_copy {
    type hw
    card Loopback
    device 0
    subdevice 0
}

# What the bridge plays to over Bluetooth: the car stereo (bluez-alsa), when
# AUDIO is BLUETOOTH and the stereo is connected. 00:00:00:00:00:00 = whichever Bluetooth audio device connected last.
# No copy into Loopback here: a "multi" of bluealsa + Loopback stalls within
# a second (Loopback XRUN freezes the whole stream), so over Bluetooth the
# visualiser gets no audio.
# "bluealsa:..." already converts formats itself; a second plug in front of it
# fails (aplay: snd_pcm_hw_param_get_min assertion), so tap_bt passes straight through.
pcm.tap_bt {
    type empty
    slave.pcm "bluealsa:DEV=00:00:00:00:00:00,PROFILE=a2dp"
}
